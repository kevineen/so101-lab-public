[project]
name = "real-eval"
version = "0.1.0"
description = "Run a sim2rl-trained RL policy (ONNX) on the real SO-101 follower with safety guards"
requires-python = ">=3.12"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.24.0",
  "onnxruntime>=1.19",
  "pyyaml>=6.0",
]

[project.scripts]
real-eval = "real_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["real_eval"]

[dependency-groups]
dev = [
  "pytest>=8.3",
]
